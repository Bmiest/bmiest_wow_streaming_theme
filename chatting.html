<title>Just Chatting</title>

<div id="stage">
  <!-- Camera-gat met dezelfde schuine hoek als de kaarten; de omlijning is
       een polygon, want een border volgt geen diagonaal. -->
  <div class="ground">
    <div class="ground__hole"></div>
    <svg class="ground__frame" viewBox="0 0 1650 930" aria-hidden="true">
      <polygon points="1,1 1649,1 1649,899 1619,929 1,929"></polygon>
    </svg>
  </div>

  <div class="jc jc__cam">
    <div class="jc__camhint">camera</div>

    <div class="jc__top">
      <div class="jc__title" id="jcTitle">Just Chatting</div>
      <div id="jcTopRibs" style="display:flex;gap:20px"></div>
    </div>

    <div class="jc__plate" id="jcPlate"></div>

    <div class="jc__chat" id="jcChatCard"></div>
    <div class="jc__strip" id="jcStrip"></div>
  </div>
</div>
