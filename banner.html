<meta charset="utf-8">
<title>Onderbalk</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ribbon.css">
<link rel="stylesheet" href="css/banner.css">

<div id="stage">
  <div id="health"></div>
  <div class="ground"><div class="ground__hole"></div></div>

  <div class="banner">

    <!-- 1 ─ camera (leeg vlak, je OBS-cam ligt hierachter) ------------->
    <section class="cam">
      <div class="cam__hint">camera</div>
      <div class="cam__plate"><span class="live"></span><span id="camName">live</span></div>
    </section>

    <!-- 2 ─ character -------------------------------------------------->
    <section class="cap cap--char">
      <svg class="wm--feather" viewBox="0 0 100 100" aria-hidden="true">
        <path fill="currentColor" d="M66 10c-16 5-30 17-38 33-6 13-8 28-6 42l8-13c10-3 20-10 28-19 11-12 14-29 8-43z"></path>
        <path stroke="currentColor" stroke-width="2.4" fill="none" d="M62 16 27 80"></path>
      </svg>

      <div class="char__portrait">
        <img id="charImg" alt="">
        <svg class="char__halo" viewBox="0 0 100 100" aria-hidden="true">
          <circle id="charHalo" cx="50" cy="50" r="48"></circle>
          <circle class="inner"  cx="50" cy="50" r="41"></circle>
        </svg>
      </div>

      <div class="char__meta" id="charBlock"
           style="transition:opacity 220ms cubic-bezier(.22,.61,.36,1),transform 220ms cubic-bezier(.22,.61,.36,1)">
        <div class="char__name" id="charName">—</div>
        <div class="char__sub">
          <span class="swatch" id="charSwatch"></span>
          <span id="charSpec"></span>
          <span class="sep">·</span>
          <span id="charGuild"></span>
        </div>
        <div class="char__stats">
          <div class="stat"><div class="stat__v" id="charIlvl">—</div><div class="stat__l">item level</div></div>
          <div class="stat"><div class="stat__v" id="charMplus">—</div><div class="stat__l">m+ score</div></div>
        </div>
        <div class="keys" id="keyList"></div>
      </div>

      <div class="rotdots" id="charDots"></div>
    </section>

    <!-- 3 ─ boss progress ---------------------------------------------->
    <section class="cap cap--boss">
      <div class="rio" id="rioWidget" style="display:none">
        <iframe id="rioFrame" scrolling="no" frameborder="0" title="Raider.IO boss progress"></iframe>
      </div>

      <div class="boss" id="bossNative" style="display:none">
        <div class="boss__art" id="bossArt"></div>
        <div class="boss__over" id="raidName">—</div>
        <div class="boss__top">
          <div class="boss__nm" id="bossName">—</div>
          <span class="boss__tag" id="bossTag" style="display:none"></span>
        </div>
        <div class="boss__sub" id="bossSub"></div>
        <div class="boss__stat">
          <div>
            <div class="boss__v" id="bossBig">—</div>
            <div class="boss__l" id="bossLbl"></div>
          </div>
          <span class="spark" id="bossSpark"></span>
        </div>
      </div>
    </section>

    <!-- 4 ─ chat -------------------------------------------------------->
    <section class="cap cap--chat">
      <div class="cap__label">chat</div>
      <div id="chatList"></div>
    </section>

    <!-- 5 ─ recente events ---------------------------------------------->
    <section class="cap cap--events">
      <div class="cap__label">recent</div>
      <div class="events" id="events"><div class="events__empty">nog niets deze sessie</div></div>
    </section>

  </div>
</div>

<script src="config.default.js"></script>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.3.1/socket.io.js"></script>
<script src="js/util.js"></script>
<script src="js/ribbon.js"></script>
<script src="js/camevent.js"></script>
<script src="js/raiderio.js"></script>
<script src="js/rio-live.js"></script>
<script src="js/chat.js"></script>
<script src="js/streamelements.js"></script>
<script src="js/banner.js"></script>
