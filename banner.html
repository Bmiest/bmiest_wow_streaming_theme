<meta charset="utf-8">
<title>Onderbalk</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ribbon.css">
<link rel="stylesheet" href="css/backdrop.css">
<link rel="stylesheet" href="css/banner.css">

<div id="stage">
  <div id="health"></div>

  <!-- Grond met het camera-gat. Het gat heeft dezelfde schuine hoek als de
       kaarten; de omlijning is een polygon, want een border volgt geen
       diagonaal. -->
  <div class="ground">
    <div class="ground__hole"></div>
    <svg class="ground__frame" viewBox="0 0 340 200" aria-hidden="true">
      <polygon points="1,1 339,1 339,169 309,199 1,199"></polygon>
    </svg>
  </div>

  <div class="banner">

    <!-- 1 ─ camera (leeg vlak, je OBS-cam ligt hierachter) ------------->
    <section class="cam">
      <div class="cam__hint">camera</div>
      <div class="cam__plate" id="camPlate"></div>
    </section>

    <!-- 2 ─ characters (één kolom per character, gevuld uit charTpl) ---->
    <div class="rcard-wrap card--char">
      <span class="rcard__cap" data-icon="sword">characters</span>
      <div class="rcard"><div class="rcard__in">
        <div class="chars" id="charRow"></div>
        <div class="rotdots" id="charDots"></div>

      </div></div>
    </div>

    <!-- 3 ─ boss progress van de guild ---------------------------------->
    <div class="rcard-wrap card--boss">
      <span class="rcard__cap" data-icon="raid">raid</span>
      <div class="rcard"><div class="rcard__in">

        <div class="rio" id="rioWidget" style="display:none">
          <iframe id="rioFrame" scrolling="no" frameborder="0" title="Raider.IO boss progress"></iframe>
        </div>

        <div class="boss" id="bossNative" style="display:none">
          <div class="boss__art" id="bossArt"></div>
          <div class="boss__over" id="raidName">—</div>
          <div class="boss__top">
            <div class="boss__nm" id="bossName">—</div>
            <span class="boss__tag" id="bossTag" style="display:none"></span>
          </div>
          <div class="boss__sub" id="bossSub"></div>
          <div class="boss__stat">
            <div>
              <div class="boss__v" id="bossBig">—</div>
              <div class="boss__l" id="bossLbl"></div>
            </div>
            <span class="spark" id="bossSpark"></span>
          </div>

          <!-- melding bij een poging erbij, een nieuwe beste of een kill; js/banner.js -->
          <div class="boss__flash" id="bossFlash"></div>
        </div>

      </div></div>
    </div>

    <!-- 4 ─ chat -------------------------------------------------------->
    <div class="rcard-wrap card--chat">
      <span class="rcard__cap" data-icon="chat">chat</span>
      <div class="rcard"><div class="rcard__in">
        <div id="chatList"></div>
      </div></div>
    </div>

    <!-- 5 ─ recente events ---------------------------------------------->
    <div class="rcard-wrap card--events">
      <span class="rcard__cap" data-icon="follow">recent</span>
      <div class="rcard"><div class="rcard__in">
        <div class="events" id="events"><div class="events__empty">nothing yet this session</div></div>
      </div></div>
    </div>

  </div>
</div>

<!-- Eén character; js/banner.js kloont dit per kolom. -->
<template id="charTpl">
  <div class="char">
    <div class="char__portrait">
      <img alt="">
      <svg class="char__halo" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring"  cx="50" cy="50" r="48"></circle>
        <circle class="inner" cx="50" cy="50" r="41"></circle>
      </svg>
    </div>

    <div class="char__meta">
      <div class="char__name">—</div>
      <div class="char__sub">
        <span class="swatch"></span>
        <span class="char__spec"></span>
        <span class="sep">·</span>
        <span class="char__guild"></span>
      </div>
      <div class="char__stats">
        <div class="stat"><div class="stat__v char__ilvl">—</div><div class="stat__l">item level</div></div>
        <div class="stat"><div class="stat__v char__score">—</div><div class="stat__l char__scorel">m+ score</div></div>
      </div>
      <div class="prog">
        <span class="prog__nm"></span>
        <span class="prog__t"></span>
      </div>
    </div>
  </div>
</template>

<script src="config.default.js"></script>
<script src="config.js"></script>
<script src="vendor/socket.io.js"></script>
<script src="js/util.js"></script>
<script src="js/ribbon.js"></script>
<script src="js/backdrop.js"></script>
<script src="js/camevent.js"></script>
<script src="js/raiderio.js"></script>
<script src="js/rio-live.js"></script>
<script src="js/chat.js"></script>
<script src="js/streamelements.js"></script>
<script src="js/banner.js"></script>
