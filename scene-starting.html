<meta charset="utf-8">
<title>Scene: starting</title>
<!-- Wrapper zodat OBS' "Local file"-vinkje bruikbaar is: dat veld is een
     bestandskiezer en slikt geen ?mode=starting. -->
<script>window.SCENE_MODE = 'starting';</script>
<script>
  document.write('<link rel="stylesheet" href="css/tokens.css">' +
                 '<link rel="stylesheet" href="css/ribbon.css">' +
                 '<link rel="stylesheet" href="css/backdrop.css">' +
                 '<link rel="stylesheet" href="css/scene.css">');

<div id="stage">

    <circle class="r1" cx="200" cy="200" r="190"></circle>
    <circle class="r2" cx="200" cy="200" r="168"></circle>
  </svg>
  <svg class="wm-feather-big" viewBox="0 0 100 100" aria-hidden="true">
    <path fill="currentColor" d="M66 10c-16 5-30 17-38 33-6 13-8 28-6 42l8-13c10-3 20-10 28-19 11-12 14-29 8-43z"></path>

  <div class="scene">

    <div class="scene__mid">

      <div class="clock" id="clock">--:--</div>
      <div class="headline" id="headline" style="display:none"></div>
      <div class="topic" id="topic"></div>

    <div class="scene__foot" id="foot"></div>
  </div>
</div>
