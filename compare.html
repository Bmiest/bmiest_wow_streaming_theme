<meta charset="utf-8">
<title>Raid source comparison: Raider.IO vs Warcraft Logs</title>
<!-- Geen overlaypagina maar een werkbank. Zet hem naast je stream open
     tijdens een raidavond en je ziet per poll wat beide bronnen zeggen en
     welke js/progress.js zou kiezen. Zo hoef je niet op de kaart zelf te
     ontdekken dat er iets niet klopt.

     Token meegeven met ?wcl=<token>, net als bij de andere pagina's. -->
<link rel="stylesheet" href="css/tokens.css">
<style>
  body{margin:0;background:var(--ink-900);color:var(--paper);
       font-family:var(--f-display);padding:32px 28px 48px}
  h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
  .sub{color:var(--ink-300);font-size:14px;margin-bottom:26px}
  .sub code{font-family:var(--f-mono);color:var(--paper-dim)}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
       gap:18px;margin-bottom:22px}
  .box{background:var(--ink-800);border:1px solid var(--ink-700);padding:20px 22px}
  .box h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;
          color:var(--ink-300);margin:0 0 14px;font-weight:600}
  .box.win{border-color:var(--jade)}
  .box.win h2{color:var(--jade)}
  .box.dead{opacity:.45}
  dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:0;
     font-size:15px;align-items:baseline}
  dt{color:var(--ink-400);font-size:12px;letter-spacing:.08em;
     text-transform:uppercase}
  dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;
     color:var(--paper)}
  dd.dim{color:var(--ink-400)}
  .verdict{background:var(--ink-850);border-left:3px solid var(--jade);
           padding:16px 20px;font-size:15px;line-height:1.55}
  .verdict b{font-family:var(--f-mono);color:var(--jade)}
  .diff{color:var(--gold)}
  .log{margin-top:26px;font-family:var(--f-mono);font-size:12px;
       color:var(--ink-400);line-height:1.7;white-space:pre-wrap}
</style>

<h1>Raider.IO vs Warcraft Logs</h1>
<p class="sub">Re-polled every 30 seconds. Fields that disagree are <span class="diff">gold</span>.
   Token goes in the URL as <code>?wcl=&lt;token&gt;</code>.</p>

<div class="row">
  <div class="box" id="boxR"><h2>raider.io</h2><dl id="dlR"></dl></div>
  <div class="box" id="boxW"><h2>warcraftlogs</h2><dl id="dlW"></dl></div>
</div>
<div class="verdict" id="verdict">waiting for the first poll…</div>
<div class="log" id="log"></div>

<script src="config.default.js"></script>
<script src="config.js"></script>
<script src="js/util.js"></script>
<script src="js/rio-live.js"></script>
<script src="js/wcl.js"></script>
<script src="js/progress.js"></script>
<script>
(function(){
  'use strict';
  var U = window.U;
  var FIELDS = ['bossName','pullCount','bestPct','phase','defeated','summary','updated'];

  function fmt(k, v){
    if(v == null || v === '') return '—';
    if(k === 'updated'){
      /* Met alleen een tijd leest 22:47 van gisteravond als twaalf minuten
         verschil in plaats van een dag -- op de pagina die juist moet laten
         zien hoe oud iets is. Datum erbij zodra het niet vandaag is. */
      var d = new Date(v), now = new Date();
      var sameDay = d.toDateString() === now.toDateString();
      return (sameDay ? '' : d.toLocaleDateString() + ' ') + d.toLocaleTimeString();
    }
    if(k === 'bestPct') return Number(v).toFixed(2) + '%';
    if(k === 'defeated') return v ? 'yes' : 'no';
    return String(v);
  }

  /* Vergelijken op de waarde zoals hij getoond wordt: anders staat 4.25 vs
     4.250001 als een verschil in beeld terwijl je hetzelfde ziet. */
  function paint(dl, rec, other){
    dl.innerHTML = '';
    if(!rec){
      dl.innerHTML = '<dt>status</dt><dd class="dim">no answer</dd>';
      return;
    }
    FIELDS.forEach(function(k){
      var mine = fmt(k, rec[k]);
      var dt = document.createElement('dt'); dt.textContent = k;
      var dd = document.createElement('dd'); dd.textContent = mine;
      if(other && fmt(k, other[k]) !== mine) dd.classList.add('diff');
      dl.appendChild(dt); dl.appendChild(dd);
    });
  }

  var DEMO = /[?&]demo=1/.test(location.search);

  /* Deze pagina houdt dezelfde stand bij als de kaart en geeft hem mee aan
     pick(). Anders kan ze het ene geval waar de drempel voor bestaat niet
     laten zien: staat de kaart op WCL terwijl Raider.IO twintig seconden
     voorloopt, dan blijft WCL staan -- en zonder die stand zou hier
     'raiderio' verschijnen, precies het omgekeerde van wat je op stream ziet. */
  var held = null;

  var WHY = {
    'ahead'     : 'furthest along',
    'held'      : 'held, lead below the threshold',
    'only'      : 'only source answering',
    'only-timed': 'the other has no timestamp',
    'untimed'   : 'neither has a timestamp'
  };

  /* Een opname van 17 september 2026, 09:45 -- de stand waarop deze hele
     bron-keuze gebouwd is. Bewust een vastgelegd voorbeeld en geen verzonnen
     getallen: dit is echt gemeten, en het staat er met de datum bij zodat
     niemand het voor de stand van vandaag aanziet. */
  var SAMPLE = {
    rio: { source:'raiderio', bossName:'Vashnik the Malignant', pullCount:19,
           bestPct:4.25, phase:'', defeated:false, summary:'4/8 Mythic',
           updated: Date.parse('2026-09-16T20:36:28Z') },
    wcl: { source:'warcraftlogs', bossName:'Vashnik the Malignant', pullCount:21,
           bestPct:0.01, phase:'', defeated:true, summary:'',
           updated: Date.parse('2026-09-16T20:47:54Z') }
  };

  /* Aanvullen en niet vervangen: in demomodus staan er vijf velden goud, en
     precies dan was de uitleg van die kleur eruit gehaald. */
  var SUB0 = document.querySelector('.sub').innerHTML;
  function sub(html){ document.querySelector('.sub').innerHTML = SUB0 + ' ' + html; }

  function demo(){
    sub('Showing a <b>recorded example</b>, not live data. ' +
        'Drop the <code>?demo=1</code> to poll for real.');
    /* Door dezelfde pick() als de kaart, niet met een uitgeschreven antwoord:
       verander je de drempel of de gelijkspelregel in js/progress.js, dan
       verandert dit voorbeeld mee in plaats van te blijven liegen. */
    render(SAMPLE.wcl, SAMPLE.rio);
    note('recorded example — Raider.IO still had the boss alive at 19 pulls');
    note('while its own progress line already counted the kill');
    note('add ?wcl=<token> to this URL to compare your own guild live');
  }

  function explain(){
    /* In de subregel en niet in het oordeel: het oordeel wordt elke poll
       overschreven, en dan is de uitleg na dertig seconden weg. */
    sub('<b>No Warcraft Logs token on this URL</b>, so there is nothing to ' +
        'compare — only Raider.IO below. Add <code>?wcl=&lt;token&gt;</code> ' +
        'for both, or see <a href="?demo=1" style="color:var(--jade)">a ' +
        'recorded example</a>.');
    note('a token is minted from a Warcraft Logs API client and lasts a year;');
    note('the client secret that mints it never goes in a page.');
  }

  var log = document.getElementById('log'), lines = [];
  function note(s){
    lines.unshift(new Date().toLocaleTimeString() + '  ' + s);
    lines.length = Math.min(lines.length, 12);   // anders groeit hij een raidavond lang door
    log.textContent = lines.join('\n');
  }

  function tick(){
    /* Allebei los ophalen, zodat je ook ziet wat de verliezer zei -- dat is
       het hele punt van deze pagina. Progress.pick() krijgt daarna dezelfde
       twee records, dus het oordeel hier is het oordeel dat de kaart velt. */
    Promise.all([
      window.RioLive.load().catch(function(e){ note('raider.io failed: ' + e.message); return null; }),
      window.WCL.available()
        ? window.WCL.load().catch(function(e){ note('wcl failed: ' + e.message); return null; })
        : Promise.resolve(null)
    ]).then(function(r){ render(r[1], r[0]); });
  }

  function render(wcl, rio){
      paint(document.getElementById('dlR'), rio, wcl);
      paint(document.getElementById('dlW'), wcl, rio);

      var got = window.Progress.pick(wcl, rio, held);
      if(got && got.rec) held = got.rec.source;
      var boxR = document.getElementById('boxR'), boxW = document.getElementById('boxW');
      boxR.className = 'box' + (rio ? '' : ' dead') + (got && got.rec === rio ? ' win' : '');
      boxW.className = 'box' + (wcl ? '' : ' dead') + (got && got.rec === wcl ? ' win' : '');

      var v = document.getElementById('verdict');
      if(!got){ v.innerHTML = 'Neither source answered — the card falls back on its remembered reading.'; return; }
      /* Alleen een voorsprong tonen als allebei een tijd hebben; anders stond
         er een verschil met epoch 0 en las je "1789934874s ahead". */
      var lead = (wcl && rio && wcl.updated != null && rio.updated != null)
        ? Math.round((wcl.updated - rio.updated) / 1000) : null;
      v.innerHTML = 'The card shows <b>' + got.rec.source + '</b> (' +
        (WHY[got.why] || got.why) + ')' +
        (lead === null ? '' :
         ', wcl is ' + (lead >= 0 ? lead + 's ahead' : (-lead) + 's behind')) + '.' +
        (got.rec.source === 'warcraftlogs'
          ? ' It still borrows the progress line and the boss portrait from Raider.IO,' +
            ' so the <code>summary</code> gap below is not lost on the card.'
          : '');

      if(wcl && rio && wcl.pullCount !== rio.pullCount)
        note('pulls disagree: wcl ' + wcl.pullCount + ' vs rio ' + rio.pullCount);
      if(wcl && rio && !!wcl.defeated !== !!rio.defeated)
        note('kill disagrees: wcl ' + wcl.defeated + ' vs rio ' + rio.defeated);
  }

  /* Zonder token valt er niets te vergelijken, en dan is een halfleeg
     scherm met één logregel geen antwoord op "wat doet deze pagina". Deze
     pagina hangt in de voettekst van de voorpagina, dus hij moet zichzelf
     kunnen uitleggen aan iemand die hier voor het eerst komt. */
  if(DEMO){ demo(); return; }

  /* Zonder token valt er niets te vergelijken, maar Raider.IO alleen is nog
     steeds het kijken waard -- dus uitleg erbij en daarna gewoon pollen. Eén
     plek die de poller start, anders lopen er bij een extra tak zomaar twee. */
  if(!window.WCL.available()) explain();
  U.poll(tick, 30);
})();
</script>
