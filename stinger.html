<meta charset="utf-8">
<title>Stinger frame</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ribbon.css">
<style>
/* Eén frame van de stinger. Framenummer via de URL (?f=..&n=..) zodat elk
   frame deterministisch is; build-stinger.sh schiet ze los af en ffmpeg
   plakt er een webm met alpha van. Dus geen CSS-animatie.

   Drie acts, naar het voorbeeld van Amused:
     1. een paneel schuift in met een golvende voorrand, met een jade band
        die er net voor uit loopt als schaduw
     2. op het dekpunt staat het merk in beeld
     3. een iris opent vanuit het midden -- concentrische ringen en twee
        sikkels die meedraaien -- en legt de nieuwe scene bloot

   Het gat is een radial-gradient met een harde stop, geen zachte overgang,
   dus er valt niets te banden. */
html,body{width:100vw;height:100vh;background:transparent;overflow:hidden;margin:0}

#shadow,#panel{position:absolute;top:-2vh;height:104vh;left:-30vw;width:160vw;will-change:transform}
#shadow{background:var(--jade);opacity:.85}
#panel {background:var(--ink-900)}

/* iris */
#iris{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#iris circle{fill:none;transform-origin:50% 50%}
#iris .ring  {stroke:var(--jade);stroke-width:5}
#iris .halo  {stroke:var(--holy);stroke-width:1.5;opacity:.35}
#iris .arc   {stroke:var(--jade);stroke-width:26;stroke-linecap:butt;opacity:.9}

#mark{position:absolute;inset:0;display:grid;place-items:center;opacity:0;
  pointer-events:none;z-index:10}
#mark .rib{--rib-h:176px;--rib-cut:54px}
#mark .rib__cap{height:46px;padding:0 24px;font-size:23px;letter-spacing:.26em;
  margin-left:44px;border-radius:9px;border-width:2px}
#mark .rib__bar{margin-top:-17px;padding:2px}
#mark .rib__val{font-size:80px;padding-left:38px}
#mark .rib__in{padding-right:92px}
#mark .rib__acc svg{width:74px;height:74px;margin-right:10px}
</style>

<div id="shadow"></div>
<div id="panel"></div>

<svg id="iris" aria-hidden="true">
  <circle class="arc"  cx="50%" cy="50%" r="10"></circle>
  <circle class="ring" cx="50%" cy="50%" r="10"></circle>
  <circle class="halo" cx="50%" cy="50%" r="10"></circle>
</svg>

<div id="mark">
  <div class="rib" style="--acc:var(--jade)">
    <span class="rib__cap">kanaal</span>
    <div class="rib__bar"><div class="rib__in">
      <span class="rib__acc"><svg viewBox="0 0 18 18">
        <path d="M14.6 3.4 7.8 10.2M12.4 3.4h2.2v2.2M3.4 14.6l3.2-3.2M4.6 12.2l1.2 1.2"
              fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg></span>
      <span class="rib__val" id="markTxt">bmiest</span>
    </div></div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var n = Math.max(2, +(q.get('n') || 30));
  var f = Math.min(n - 1, Math.max(0, +(q.get('f') || 0)));
  var t = f / (n - 1);

  var C = window.OVERLAY_CONFIG || {};
  document.getElementById('markTxt').textContent =
    (C.stinger && C.stinger.text) || C.camName || 'bmiest';

  function ease(x){ return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2; }
  function out(x){ return 1 - Math.pow(1 - x, 3); }
  function cl(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }

  /* ---- golvende voorrand ------------------------------------------
     Twee sinussen op elkaar, zodat het geen mechanisch golfje wordt.
     De vorm ligt vast; alleen het paneel schuift. */
  function waveClip(amp){
    var pts = ['0% 0%'], N = 26;
    for(var i = 0; i <= N; i++){
      var y = i / N;
      var w = Math.sin(y * Math.PI * 2.1) * 0.62 + Math.sin(y * Math.PI * 4.7 + 1.1) * 0.38;
      pts.push((100 - amp + w * amp).toFixed(3) + '% ' + (y * 100).toFixed(2) + '%');
    }
    pts.push('0% 100%');
    return 'polygon(' + pts.join(',') + ')';
  }
  var clip = waveClip(2.4);
  document.getElementById('panel').style.clipPath  = clip;
  document.getElementById('shadow').style.clipPath = clip;

  /* ---- act 1: inschuiven ------------------------------------------- */
  var COVER = 0.44;                      // hier is het beeld dicht
  var pIn = cl(ease(cl(t / COVER)));
  var x   = -132 + 132 * pIn;            // vw
  document.getElementById('panel').style.transform  = 'translateX(' + x.toFixed(3) + 'vw)';
  // de jade band loopt er net voor uit
  document.getElementById('shadow').style.transform =
    'translateX(' + (x + (1 - pIn) * 3.4 + 1.6).toFixed(3) + 'vw)';

  /* ---- act 3: iris opent ------------------------------------------- */
  var W = innerWidth, H = innerHeight;
  var maxR = Math.sqrt(W*W + H*H) / 2 * 1.06;
  var pOut = cl(out(cl((t - 0.5) / 0.5)));
  var R = pOut * maxR;

  var hole = 'radial-gradient(circle at 50% 50%, transparent 0 ' + R.toFixed(1) +
             'px, #000 ' + R.toFixed(1) + 'px)';
  ['panel','shadow'].forEach(function(id){
    var el = document.getElementById(id);
    el.style.webkitMaskImage = hole;
    el.style.maskImage = hole;
  });

  /* ringen en sikkels op de rand van het gat */
  var iris = document.getElementById('iris');
  var vis  = R > 4 && pOut < 0.995;
  iris.style.opacity = vis ? '1' : '0';
  if(vis){
    var ring = iris.querySelector('.ring'), halo = iris.querySelector('.halo'),
        arc  = iris.querySelector('.arc');
    ring.setAttribute('r', R.toFixed(1));
    halo.setAttribute('r', (R * 1.13).toFixed(1));
    var ar = R * 1.34;
    arc.setAttribute('r', ar.toFixed(1));
    // twee sikkels tegenover elkaar, die meedraaien terwijl de iris opent
    var c = 2 * Math.PI * ar;
    arc.setAttribute('stroke-dasharray', (c * 0.17).toFixed(1) + ' ' + (c * 0.33).toFixed(1));
    arc.style.transform = 'rotate(' + (pOut * 190 - 40).toFixed(1) + 'deg)';
    // aan het eind uitfaden zodat de ringen niet hard afkappen
    iris.style.opacity = (1 - cl((pOut - 0.72) / 0.28)).toFixed(3);
  }

  /* ---- merk --------------------------------------------------------- */
  /* Trapezium in plaats van een punt: volledig dekkend op het moment dat
     het beeld dicht is, en helemaal weg voordat de iris opengaat. Anders
     hangt de naam halfdoorzichtig over de nieuwe scene. */
  var m  = document.getElementById('mark');
  var op = Math.min(cl((t - 0.25) / 0.14), cl((0.515 - t) / 0.05));
  m.style.opacity   = op.toFixed(3);
  m.style.transform = 'scale(' + (0.965 + 0.035 * op).toFixed(4) + ')';
})();
</script>
